{% extends 'base.html' %}
{% block title %}Server Error - ShopKart{% endblock %}
{% block content %}
<div class="container" style="text-align: center; padding: 80px 16px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--danger);">500</div>
  <h1 style="font-size: 1.8rem; margin: 12px 0;">Something Went Wrong</h1>
  <p style="color: var(--text-secondary); margin-bottom: 24px;">Our team has been notified. Please try again in a few moments.</p>
  <a href="{{ url_for('products.home') }}" class="btn btn-primary btn-lg">Back to Homepage</a>
</div>
{% endblock %}
